name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: puzzlebook-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --locked
      - run: uv run pytest
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/941271455567/locations/global/workloadIdentityPools/puzzlebook-github/providers/github
          service_account: puzzlebook-deploy@personal-ai-264306.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy to Cloud Run
        run: bash scripts/deploy.sh --labels=commit-sha="$GITHUB_SHA"
      - name: Check the live page
        run: curl --fail --silent --show-error https://puzzlebook-941271455567.europe-west1.run.app/ -o /dev/null
