<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf8">
  <title>חידות מתמטיות</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --paper: #fffdf8; --ink: #202128; --muted: #77766f; --line: #dedbd2; --accent: #eeeaf7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid #746498; outline-offset: 4px; }
    .topbar { flex-shrink: 0; height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: relative; }
    .topbar::after { content: ""; position: absolute; bottom: 0; inset-inline: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(154,146,125,.16) 25%, rgba(154,146,125,.16) 75%, transparent); }
    .brand { text-decoration: none; font-size: 22px; font-weight: 750; letter-spacing: -.6px; }
    .book-footer { margin-top: 40px; text-align: center; }
    .book-footer::before { content: ""; display: block; width: 88px; height: 1px; background: linear-gradient(90deg, transparent, rgba(154,146,125,.3), transparent); margin: 0 auto 14px; }
    .book-credit { text-decoration: none; color: var(--muted); font-size: 13px; }
    .layout { display: grid; grid-template-columns: 312px minmax(0, 1fr); flex: 1; min-height: 0; }
    .sidebar { display: flex; flex-direction: column; min-height: 0; background: #f7f5ef; border-left: 1px solid var(--line); }
    .sidebar-heading { padding: 28px 25px 20px; display: flex; align-items: baseline; justify-content: space-between; }
    .sidebar-heading h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .sidebar-heading span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .puzzle-list { overflow-y: auto; padding: 0 12px 24px; scrollbar-width: thin; scrollbar-color: #cbc7be transparent; }
    .puzzle-link { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 11px 12px; border: 1px solid transparent; border-radius: 5px; text-decoration: none; font-size: 13px; line-height: 1.5; transition: background .15s; }
    .puzzle-link:hover { background: #edeae2; }
    .puzzle-link[aria-current="true"] { background: var(--accent); border-color: #d8d0e6; }
    .number { color: #949087; font-size: 11px; font-variant-numeric: tabular-nums; min-width: 22px; }
    .name { flex: 1; }
    .list-level { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .reader { min-height: 0; overflow-y: auto; padding: 64px clamp(32px, 6vw, 96px) 40px; }
    .welcome { width: 100%; max-width: 720px; margin: 0 auto; }
    .welcome-intro { margin: 0; text-align: center; font-size: 20px; line-height: 1.8; }
    .welcome-image { display: block; width: 100%; max-width: 640px; height: auto; margin: 28px auto 0; mix-blend-mode: multiply; }
    .puzzle { width: 100%; max-width: 720px; margin: 0 auto; }
    .language-control { display: flex; justify-content: flex-end; margin-bottom: 22px; }
    .puzzle-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 30px; }
    .original { background: transparent; border: 1px solid var(--ink); border-radius: 5px; padding: 8px 17px; box-shadow: 2px 2px 0 var(--ink); font-size: 12px; transition: transform .15s, box-shadow .15s; }
    .original:hover { background: #f0ece2; }
    .original:active { transform: translate(2px,2px); box-shadow: none; }
    h1 { font-size: clamp(30px, 3.4vw, 44px); line-height: 1.25; letter-spacing: -1px; margin: 0; font-weight: 700; flex: 1; min-width: 160px; }
    .body { font-size: 20px; line-height: 1.95; letter-spacing: -.15px; white-space: pre-line; overflow-wrap: anywhere; margin: 0; }
    .body[lang="en"] { font-size: 19px; line-height: 1.85; letter-spacing: 0; }
    .figures { display: grid; gap: 24px; margin-top: 30px; }
    .figures:empty { display: none; }
    .figures img { display: block; max-width: min(100%, 420px); max-height: 440px; width: auto; height: auto; margin: 0 auto; mix-blend-mode: multiply; }
    .illustration { display: block; width: 100%; max-width: 600px; height: auto; margin: 28px auto 0; mix-blend-mode: multiply; }
    [hidden] { display: none !important; }
    .hint-toggle { margin-top: 32px; background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 9px 18px; font-size: 13px; }
    .hint-toggle:hover { background: #f0ece2; }
    .hint-panel { margin-top: 16px; padding: 24px; border: 1px solid #d8d0e6; border-radius: 7px; background: #f6f3fa; }
    .hint-panel h2 { font-size: 19px; margin: 0 0 12px; }
    .hint-body { font-size: 16px; line-height: 1.8; margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
    .ask { max-width: 720px; margin: 36px auto 0; }
    .ask form { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid #e5e1d8; border-radius: 18px; background: #fffefa; box-shadow: 0 2px 8px rgba(32,33,40,.025); transition: border-color .2s, box-shadow .2s; }
    .ask form:focus-within { border-color: #aaa0ba; box-shadow: 0 0 0 3px rgba(116,100,152,.08); }
    .ask input { min-width: 0; flex: 1; padding: 12px 14px; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; font-size: 16px; text-align: right; }
    .ask input::placeholder { color: #969189; }
    .ask button { position: relative; flex-shrink: 0; min-width: 76px; min-height: 44px; padding: 10px 22px; border: 0; border-radius: 12px; background: var(--ink); color: #fffdf8; font-size: 14px; font-weight: 500; transition: background .2s, transform .15s; }
    .ask button:hover:not(:disabled) { background: #3d3d46; }
    .ask button:active:not(:disabled) { transform: scale(.97); }
    .ask button:disabled { cursor: default; }
    .ask button[aria-busy="true"] .ask-label { opacity: 0; }
    .ask-spinner { display: none; position: absolute; inset: 0; width: 16px; height: 16px; margin: auto; border: 1.5px solid rgba(255,253,248,.3); border-top-color: #fffdf8; border-radius: 50%; animation: spin .8s linear infinite; }
    .ask button[aria-busy="true"] .ask-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .answer { margin-top: 14px; padding: 18px 20px; border: 1px solid #e9e5dc; border-radius: 16px; background: rgba(255,255,255,.45); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 17px; line-height: 1.8; }
    .mobile-toggle { display: none; }
    .skip { position: absolute; top: -60px; background: var(--paper); padding: 12px; z-index: 5; }
    .skip:focus { top: 8px; }
    @media (max-width: 760px) {
      .topbar { height: 64px; padding: 0 20px; }
      .brand { font-size: 20px; }
      .mobile-toggle { display: block; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; font-size: 12px; }
      .layout { display: block; position: relative; }
      .sidebar { display: none; position: absolute; inset: 0; z-index: 2; border: 0; }
      .sidebar.is-open { display: flex; }
      .reader { height: 100%; padding: 36px 24px 40px; }
      .body { font-size: 18px; }
      .puzzle-heading { gap: 10px; margin-bottom: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#reader">לתוכן החידה</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="לעמוד הבית">חידות מתמטיות<span style="color:#9a927d">.</span></a>
    <button class="mobile-toggle" id="mobile-toggle" type="button" aria-expanded="false" aria-controls="sidebar">כל החידות</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="רשימת חידות">
      <div class="sidebar-heading"><h2>כל החידות</h2><span>{{ puzzles | length }} חידות</span></div>
      <nav class="puzzle-list" aria-label="בחירת חידה">
        {% for puzzle in puzzles %}
        <a class="puzzle-link" href="#puzzle-{{ puzzle.id }}" data-id="{{ puzzle.id }}">
          <span class="number" dir="ltr">{{ '%03d' | format(puzzle.id) }}</span>
          <span class="name">{{ puzzle.title_he }}</span>
          <span class="list-level">{{ levels[puzzle.level] }}</span>
        </a>
        {% endfor %}
      </nav>
    </aside>
    <main class="reader" id="reader" tabindex="-1">
      <section class="welcome" id="welcome" aria-label="אודות הספר">
        <p class="welcome-intro">תרגום לעברית של <a href="https://math.dartmouth.edu/news-resources/electronic/puzzlebook/book/book.pdf" target="_blank" rel="noopener noreferrer"><bdi dir="ltr">Mathematical Puzzles</bdi></a></p>
        <img class="welcome-image" src="https://storage.googleapis.com/puzzlebook-images-941271455567/welcome-family-v2.webp" width="1024" height="687" alt="אבא ושני ילדיו קוראים יחד בספר חידות מתמטיות" decoding="async">
      </section>
      <article class="puzzle" id="puzzle-view" aria-labelledby="puzzle-title" hidden>
        <div class="language-control"><button class="original" id="original" type="button" aria-pressed="false">Original ↗</button></div>
        <div id="puzzle-content" aria-live="polite" aria-atomic="true">
          <div class="puzzle-heading">
            <h1 id="puzzle-title"></h1>
          </div>
          <p class="body" id="puzzle-body" lang="he" dir="rtl"></p>
          <div class="figures" id="figures"></div>
          <img class="illustration" id="illustration" alt="" hidden decoding="async">
        </div>
        <button class="hint-toggle" id="hint-toggle" type="button" aria-expanded="false" aria-controls="hint-panel">רמז</button>
        <section class="hint-panel" id="hint-panel" aria-labelledby="hint-title" hidden>
          <h2 id="hint-title">רמז</h2>
          <p class="hint-body" id="hint-body" tabindex="-1"></p>
        </section>
      </article>
      <section class="ask" id="ask" aria-label="שאלה" hidden>
        <form id="ask-form">
          <input id="question" name="question" type="text" dir="rtl" placeholder="ענה או התייעץ עם &#x2066;ai&#x2069;" aria-label="ענה או התייעץ עם ai" maxlength="10000" required>
          <button id="ask-button" type="submit" aria-label="שאל" aria-busy="false"><span class="ask-label">שאל</span><span class="ask-spinner" aria-hidden="true"></span></button>
        </form>
        <div class="answer" id="answer" dir="auto" role="status" aria-label="תשובה" aria-live="polite" aria-atomic="false" hidden></div>
      </section>
      <footer class="book-footer">
          <a class="book-credit" dir="ltr" href="https://math.dartmouth.edu/news-resources/electronic/puzzlebook/book/book.pdf" target="_blank" rel="noopener noreferrer">Mathematical Puzzles · Peter Winkler</a>
      </footer>
    </main>
  </div>
  <noscript>יש להפעיל JavaScript כדי לעבור בין החידות ולקרוא את המקור באנגלית.</noscript>
  <script id="puzzle-data" type="application/json">{{ puzzles | tojson }}</script>
  <script id="hint-data" type="application/json">{{ hints | tojson }}</script>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    function scrollToTop() {
      document.getElementById('reader').scrollTop = 0;
      window.scrollTo(0, 0);
    }
    addEventListener('pageshow', () => requestAnimationFrame(scrollToTop));
    const puzzles = JSON.parse(document.getElementById('puzzle-data').textContent);
    const hints = new Map(JSON.parse(document.getElementById('hint-data').textContent).map(h => [h.id, h]));
    const catalog = new Map(puzzles.map(p => [p.id, p]));
    const sidebar = document.getElementById('sidebar');
    const mobileToggle = document.getElementById('mobile-toggle');
    const original = document.getElementById('original');
    const welcome = document.getElementById('welcome');
    const puzzleView = document.getElementById('puzzle-view');
    const question = document.getElementById('question');
    const ask = document.getElementById('ask');
    const answer = document.getElementById('answer');
    const askButton = document.getElementById('ask-button');
    let answerController = null;
    function setAsking(busy) {
      askButton.disabled = busy;
      askButton.setAttribute('aria-busy', String(busy));
      answer.setAttribute('aria-busy', String(busy));
    }
    function resetQuestion() {
      answerController?.abort(); answerController = null;
      question.value = ''; answer.textContent = ''; answer.hidden = true;
      setAsking(false);
    }
    document.getElementById('ask-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!current || !question.value.trim() || askButton.disabled) return;
      const controller = new AbortController(); answerController = controller;
      answer.textContent = ''; answer.hidden = true; setAsking(true);
      let completed = false;
      try {
        const response = await fetch('/api/ask', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: question.value, puzzle_id: current.id}), signal: controller.signal,
        });
        if (!response.ok) throw new Error('לא ניתן לקבל תשובה כרגע. נסו שוב.');
        const stream = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const {value, done} = await stream.read();
          buffer += decoder.decode(value, {stream: !done});
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const frame = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);
            if (!frame.startsWith('data: ')) continue;
            const message = JSON.parse(frame.slice(6));
            if (message.type === 'text') { answer.hidden = false; answer.append(document.createTextNode(message.text)); }
            else if (message.type === 'error') throw new Error(message.message);
            else if (message.type === 'done') completed = true;
          }
          if (done) break;
        }
        if (!completed) throw new Error('התשובה נקטעה. נסו שוב.');
      } catch (error) {
        if (error.name !== 'AbortError' && answerController === controller) {
          answer.hidden = false;
          answer.append(document.createTextNode((answer.textContent ? '\n\n' : '') + error.message));
          controller.abort();
        }
      } finally {
        if (answerController === controller) {
          answerController = null; setAsking(false);
        }
      }
    });
    let current = null, english = false;
    const hintToggle = document.getElementById('hint-toggle');
    const hintPanel = document.getElementById('hint-panel');
    let hintOpen = false;
    function resetHint() { hintOpen = false; renderHint(); }
    function renderHint() {
      hintPanel.hidden = !hintOpen;
      hintPanel.lang = english ? 'en' : 'he'; hintPanel.dir = english ? 'ltr' : 'rtl';
      hintToggle.textContent = hintOpen ? (english ? 'Close hint' : 'סגור רמז') : (english ? 'Hint' : 'רמז');
      hintToggle.setAttribute('aria-expanded', String(hintOpen));
      document.getElementById('hint-title').textContent = english ? 'Hint' : 'רמז';
      const hint = hints.get(current.id);
      setReadingText(document.getElementById('hint-body'), hintOpen ? (english ? hint.hint_en : hint.hint_he) : '', english);
    }
    hintToggle.addEventListener('click', () => { hintOpen = !hintOpen; renderHint(); });
    function closeSidebar() {
      sidebar.classList.remove('is-open'); mobileToggle.setAttribute('aria-expanded', 'false'); mobileToggle.textContent = 'כל החידות';
    }
    function setReadingText(body, text, ltr) {
      body.replaceChildren();
      if (ltr) body.textContent = text;
      else {
        // Isolate formulas so RTL punctuation does not reverse their operators.
        const math = /[A-Za-z0-9√][A-Za-z0-9√²³⁴⁵⁶⁷⁸⁹⁰ⁿᵇᵈ₀₁₂₃₄₅₆₇₈₉ₘₙ^/*()+×=<>., −-]*/g;
        let start = 0;
        for (const match of text.matchAll(math)) {
          body.append(document.createTextNode(text.slice(start, match.index)));
          const term = document.createElement('bdi'); term.dir = 'ltr'; term.textContent = match[0].trimEnd();
          if (match[0].trim().length < 35) term.style.whiteSpace = 'nowrap';
          body.append(term, document.createTextNode(match[0].slice(match[0].trimEnd().length))); start = match.index + match[0].length;
        }
        body.append(document.createTextNode(text.slice(start)));
      }
    }
    function render() {
      welcome.hidden = true; puzzleView.hidden = false; ask.hidden = false;
      const title = document.getElementById('puzzle-title');
      const body = document.getElementById('puzzle-body');
      title.textContent = english ? current.title_en : current.title_he;
      title.dir = body.dir = english ? 'ltr' : 'rtl';
      title.lang = body.lang = english ? 'en' : 'he';
      setReadingText(body, english ? current.body_en : current.body_he, english);
      original.textContent = english ? 'עברית ↩' : 'Original ↗'; original.setAttribute('aria-pressed', String(english));
      document.title = current.title_he + ' · חידות מתמטיות';
      const figures = document.getElementById('figures'); figures.replaceChildren();
      current.figures.forEach(path => { const img = document.createElement('img'); img.src = '/static/figures/' + path; img.alt = english ? 'Original puzzle diagram' : 'איור השאלה מתוך הספר'; figures.append(img); });
      const illustration = document.getElementById('illustration');
      illustration.hidden = !current.illustration;
      if (current.illustration) {
        illustration.src = current.illustration.url;
        illustration.width = current.illustration.width; illustration.height = current.illustration.height;
        illustration.alt = english ? 'Illustration for ' + current.title_en : 'איור לחידה: ' + current.title_he;
      } else illustration.removeAttribute('src');
      document.querySelectorAll('.puzzle-link[aria-current]').forEach(a => a.removeAttribute('aria-current'));
      document.querySelector('.puzzle-link[data-id="' + current.id + '"]').setAttribute('aria-current', 'true');
      renderHint();
    }
    function selectFromHash() {
      const match = location.hash.match(/^#puzzle-(\d+)$/);
      const next = match && catalog.get(Number(match[1]));
      if (location.hash !== '#reader') resetQuestion();
      if (!next) {
        if (location.hash === '#reader') return;
        current = null; english = false; hintOpen = false; hintPanel.hidden = true;
        welcome.hidden = false; puzzleView.hidden = true; ask.hidden = true;
        document.title = 'חידות מתמטיות';
        document.querySelectorAll('.puzzle-link[aria-current]').forEach(a => a.removeAttribute('aria-current'));
        closeSidebar(); scrollToTop(); return;
      }
      current = next; english = false; resetHint(); render(); closeSidebar(); scrollToTop();
    }
    original.addEventListener('click', () => { english = !english; render(); });
    mobileToggle.addEventListener('click', () => { const open = sidebar.classList.toggle('is-open'); mobileToggle.setAttribute('aria-expanded', String(open)); mobileToggle.textContent = open ? 'סגירה' : 'כל החידות'; });
    document.querySelector('.puzzle-list').addEventListener('click', event => {
      const link = event.target.closest('.puzzle-link'); if (!link) return;
      resetQuestion();
      current = catalog.get(Number(link.dataset.id)); english = false; resetHint(); render(); closeSidebar(); scrollToTop();
    });
    addEventListener('hashchange', selectFromHash);
    addEventListener('keydown', event => { if (event.key === 'Escape') { closeSidebar(); if (hintOpen) { resetHint(); hintToggle.focus(); } } });
    selectFromHash();
    scrollToTop();
  </script>
</body>
</html>
